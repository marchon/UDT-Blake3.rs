[workspace]
resolver = "2"
members = [
    "crates/udt-core",
    "crates/udt-socket",
    "crates/udt-cli",
    "crates/udt-interop",
]
# Pure-Rust transfer path only. udt-interop is optional (C++ reference peers).
default-members = [
    "crates/udt-core",
    "crates/udt-socket",
    "crates/udt-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "BSD-3-Clause"
authors = ["Marchon <Marchon@gmail.com>"]
repository = "https://github.com/marchon/UDT-Blake3.rs"

[workspace.dependencies]
udt-core = { path = "crates/udt-core" }
udt-socket = { path = "crates/udt-socket" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
thiserror = "2"
bytes = "1"
socket2 = "0.6"
blake3 = "1"
