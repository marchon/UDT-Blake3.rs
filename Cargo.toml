[workspace]
resolver = "2"
members = [
    "crates/udt-core",
    "crates/udt-socket",
    "crates/udt-cli",
    "crates/udt-interop",
]
default-members = [
    "crates/udt-core",
    "crates/udt-socket",
    "crates/udt-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "BSD-3-Clause"
authors = ["UDT pure-Rust contributors"]
repository = "https://github.com/example/udt-pure"

[workspace.dependencies]
udt-core = { path = "crates/udt-core" }
udt-socket = { path = "crates/udt-socket" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
thiserror = "2"
bytes = "1"
socket2 = "0.6"
